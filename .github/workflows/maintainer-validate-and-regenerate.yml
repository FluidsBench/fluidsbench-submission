name: Maintainer approve and regenerate

on:
  workflow_dispatch:
    inputs:
      submission_directory:
        description: submissions/<dataset-id>/<submission-id>
        required: true
        type: string
      validated_by:
        description: Name recorded as the validating maintainer
        required: true
        type: string
      validated_at:
        description: Timezone-qualified validation time, for example 2026-07-27T18:30:00Z
        required: true
        type: string
      approved_by:
        description: Name recorded as the approving maintainer
        required: true
        type: string
      approved_at:
        description: Approval date in YYYY-MM-DD form
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: maintainer-approval-${{ inputs.submission_directory }}
  cancel-in-progress: false

jobs:
  approve:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Resolve submission directory
        id: submission
        env:
          REQUESTED_DIRECTORY: ${{ inputs.submission_directory }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          root = Path.cwd().resolve()
          submissions = (root / "submissions").resolve()
          requested = (root / os.environ["REQUESTED_DIRECTORY"]).resolve()
          if not requested.is_relative_to(submissions):
              raise SystemExit("submission_directory must remain under submissions/")
          relative = requested.relative_to(submissions)
          if len(relative.parts) != 2 or not (requested / "submission.json").is_file():
              raise SystemExit("expected submissions/<dataset-id>/<submission-id>/submission.json")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"path={requested.relative_to(root)}\n")
              output.write(f"id={relative.parts[1]}\n")
          PY
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Test WindsorML contributor packaging and dev registration
        run: python -m pytest -q tests/test_windsorml_candidate_workflow.py
      - name: Validate source package
        run: python scripts/validate_submission.py "${{ steps.submission.outputs.path }}"
      - name: Create validated approval with temporary PR binding
        env:
          PLACEHOLDER_PR_URL: https://github.com/${{ github.repository }}/pull/0
          VALIDATED_BY: ${{ inputs.validated_by }}
          VALIDATED_AT: ${{ inputs.validated_at }}
          APPROVED_BY: ${{ inputs.approved_by }}
          APPROVED_AT: ${{ inputs.approved_at }}
        run: |
          python scripts/manage_leaderboard.py approve \
            "${{ steps.submission.outputs.path }}" \
            --validated-by "$VALIDATED_BY" \
            --validated-at "$VALIDATED_AT" \
            --approved-by "$APPROVED_BY" \
            --approved-at "$APPROVED_AT" \
            --pull-request-url "$PLACEHOLDER_PR_URL" \
            --skip-feed-build
      - name: Open draft approval pull request
        id: approval_pr
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: ${{ github.ref_name }}
          branch: maintainer/approve-${{ steps.submission.outputs.id }}
          delete-branch: true
          draft: true
          commit-message: Approve ${{ steps.submission.outputs.id }}
          title: Approve ${{ steps.submission.outputs.id }}
          labels: maintainer-validation
          body: |
            Maintainer validation and approval generated by the explicit workflow dispatch.

            The package validator checks submitted metadata and hash bindings. Optional
            prediction-artifact sharing or checks do not control approval, ranking,
            citation eligibility, or promotion eligibility.
      - name: Bind the actual PR URL and regenerate feeds
        env:
          VALIDATED_BY: ${{ inputs.validated_by }}
          VALIDATED_AT: ${{ inputs.validated_at }}
          APPROVED_BY: ${{ inputs.approved_by }}
          APPROVED_AT: ${{ inputs.approved_at }}
          APPROVAL_PR_URL: ${{ steps.approval_pr.outputs.pull-request-url }}
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          python scripts/manage_leaderboard.py approve \
            "${{ steps.submission.outputs.path }}" \
            --validated-by "$VALIDATED_BY" \
            --validated-at "$VALIDATED_AT" \
            --approved-by "$APPROVED_BY" \
            --approved-at "$APPROVED_AT" \
            --pull-request-url "$APPROVAL_PR_URL" \
            --update-existing
          intake_args=()
          python scripts/manage_leaderboard.py check "${intake_args[@]}"
          git diff --check
      - name: Update draft approval pull request
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: ${{ github.ref_name }}
          branch: maintainer/approve-${{ steps.submission.outputs.id }}
          delete-branch: true
          draft: true
          commit-message: Bind approval PR and regenerate feeds
          title: Approve ${{ steps.submission.outputs.id }}
          labels: maintainer-validation
          body: |
            Maintainer validation and approval generated by the explicit workflow dispatch.

            This draft binds the exact pull-request URL and regenerated compact release
            files. Branch protection leaves the final review and merge to a maintainer.
