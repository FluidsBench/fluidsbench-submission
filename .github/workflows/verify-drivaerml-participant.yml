name: Verify DrivAerML participant runtime
on:
  pull_request:
    paths:
      - 'reference/drivaerml/**'
      - 'scripts/*drivaerml*'
      - 'benchmark-specs/drivaerml/**'
      - 'tests/test_drivaerml*'
      - 'requirements-drivaerml-participant.txt'
      - 'Dockerfile.drivaerml*'
      - '.github/workflows/verify-drivaerml-participant.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: docker build -f Dockerfile.drivaerml -t fluidsbench-drivaerml .
      - name: Verify frozen Linux runtime
        run: >-
          docker run --rm --entrypoint python fluidsbench-drivaerml -c
          "import platform,numpy,vtk; assert platform.python_version() == '3.12.13'; assert numpy.__version__ == '2.2.6'; assert vtk.vtkVersion.GetVTKVersion() == '9.5.2'"
      - run: docker run --rm fluidsbench-drivaerml --help
      - name: Plan the official surface-only split without downloading native data
        run: docker run --rm fluidsbench-drivaerml fetch-data --split-id full --prediction-scope surface_only --destination /data --dry-run
      - name: Test pinned runtime and participant recovery
        run: >-
          docker run --rm --entrypoint sh fluidsbench-drivaerml -c
          'python -m pip install pytest==8.4.2 && python -m pytest -q tests/test_drivaerml_autocfd5_parity.py tests/test_drivaerml_participant_workflow.py tests/test_drivaerml_native_surface.py tests/test_drivaerml_evaluator.py'
      - name: Verify packaging and official intake inside the Linux image
        run: >-
          docker run --rm -v "$PWD:/work" -w /work --entrypoint sh fluidsbench-drivaerml -c
          'git config --global --add safe.directory /work && python -m pip install pytest==8.4.2 && python -m pytest -q tests/test_drivaerml_dev_workflow.py'
